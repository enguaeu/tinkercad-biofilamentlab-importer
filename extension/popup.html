<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  body {
    width: 290px;
    margin: 0;
    padding: 16px;
    background: #18140f;
    color: #f6efe6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    text-align: center;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .title {
    font-size: 16px;
    font-weight: 700;
    color: #f0a23a;
  }
  .subtitle {
    font-size: 12px;
    color: #a89a8a;
    margin-bottom: 16px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    text-decoration: none;
    box-sizing: border-box;
    margin-bottom: 8px;
    transition: all 0.2s;
  }
  .btn-primary {
    background: #f0a23a;
    color: #17130e;
  }
  .btn-primary:hover {
    background: #e2952e;
  }
  .btn-secondary {
    background: #282117;
    color: #f0a23a;
    border: 1px solid #4a3822;
  }
  .btn-secondary:hover {
    background: #332b1f;
  }
  .status {
    font-size: 11px;
    color: #a89a8a;
    margin-top: 10px;
    padding: 6px;
    background: #201a13;
    border-radius: 6px;
    min-height: 20px;
    line-height: 1.4;
  }
  .footer {
    margin-top: 12px;
    font-size: 10px;
    color: #7d6f5f;
  }
  .footer a {
    color: #a89a8a;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">🔬</span>
    <span class="title">Biofilament Lab</span>
  </div>
  <div class="subtitle">تصدير مجسمات Tinkercad إلى مختبر 3D</div>

  <button id="btn-export" class="btn btn-primary">🚀 تصدير التصميم المفتوح</button>
  <button id="btn-open-lab" class="btn btn-secondary">🌐 فتح Biofilament Lab</button>

  <div id="status" class="status">جاهز للاستخدام في صفحة محرر Tinkercad</div>

  <div class="footer">
    <span>v0.2.7 · </span>
    <a href="https://github.com/enguaeu/tinkercad-biofilamentlab-importer" target="_blank">GitHub @enguaeu</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
